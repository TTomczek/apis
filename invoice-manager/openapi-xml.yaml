          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/SalesTax'
        '404':
          description: Sales tax with given id not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error while updating the sales tax
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a sales tax
      description: Delete an existing sales tax using its unique identifier. Throws an error if the sales tax is associated with any invoices.
      tags:
        - Sales Taxes
      operationId: deleteSalesTaxById
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the sales tax
          schema:
            type: integer
      responses:
        '200':
          description: The sales tax was deleted
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/SalesTax'
        '404':
          description: Sales tax with given id not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error while deleting the sales tax
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
  # Files
  /files:
    post:
      summary: Upload a file
      description: Upload a new file to use as invoice template as multipart/form-data. Returns the id of the uploaded file.
      tags:
        - Files
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/File'
      responses:
        '201':
          description: The file was uploaded
          content:
            application/xml:
              schema:
                description: The id of the uploaded file
                type: integer
        '500':
          description: Error while uploading the file
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
  /files/{id}:
    get:
      summary: Download a file
      description: Download a file by its unique identifier.
      tags:
        - Files
      operationId: downloadFileById
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the file
          schema:
            type: integer
      responses:
        '200':
          description: The file
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/DownloadFile'
        '404':
          description: File with given id not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    SalesTax:
      type: object
      xml:
        name: SalesTax
      properties:
        id:
          type: integer
        rate:
          type: number
        name:
          type: string
      required:
        - rate
        - name
      example:
        id: 1
        rate: 19.0
        name: Standard VAT
    InvoicePosition:
      type: object
      xml:
        name: InvoicePosition
      properties:
        id:
          type: integer
        description:
          type: string
        pricePerUnitInCents:
          type: number
        quantity:
          type: number
          format: float
        unit:
          type: string
          enum:
            - hour
            - pd
            - piece
        invoice:
          type: integer
      required:
        - pricePerUnitInCents
        - quantity
        - unit
        - invoice
      example:
        id: 1
        description: Consulting services
        pricePerUnitInCents: 15000
        quantity: 2.5
        unit: hour
        invoice: 1
    InvoiceTemplate:
      type: object
      xml:
        name: InvoiceTemplate
      properties:
        id:
          type: integer
        name:
          type: string
        marginTopFirstPage:
          type: number
          format: float
        marginBottomFirstPage:
          type: number
          format: float
        marginTopOtherPages:
          type: number
          format: float
        marginBottomOtherPages:
          type: number
          format: float
        fileId:
          type: integer
      required:
        - name
        - marginTopFirstPage
        - marginBottomFirstPage
        - marginTopOtherPages
        - marginBottomOtherPages
      example:
        id: 1
        name: Standard Template
        marginTopFirstPage: 20.0
        marginBottomFirstPage: 20.0
        marginTopOtherPages: 15.0
        marginBottomOtherPages: 15.0
        fileId: 1
    ContactPerson:
      type: object
      xml:
        name: ContactPerson
      properties:
        id:
          type: integer
        name:
          type: string
        firstName:
          type: string
        email:
          type: string
        salutation:
          type: string
          enum:
            - Frau
            - Herr
            - Divers
        address:
          $ref: '#/components/schemas/Address'
        businessPartner:
          type: integer
      required:
        - firstName
        - name
        - salutation
        - businessPartner
        - email
      example:
        id: 1
        name: Doe
        firstName: John
        email: john.doe@example.com
        salutation: Herr
        address:
          id: 1
          street: Main Street
          number: 123
          zip: 12345
          city: Sample City
          country: Sample Country
        businessPartner: 1
    BusinessPartner:
      type: object
      xml:
        name: BusinessPartner
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        contactPersons:
          type: array
          items:
            type: integer
        invoices:
          type: array
          items:
            type: integer
      required:
        - name
        - address
      example:
        id: 1
        name: Acme Corporation
        description: A sample business partner
        address:
          id: 1
          street: Main Street
          number: 123
          zip: 12345
          city: Sample City
          country: Sample Country
        contactPersons:
          - 1
        invoices:
          - 1
    Address:
      type: object
      xml:
        name: Address
      properties:
        id:
          type: integer
        street:
          type: string
        number:
          type: string
        zip:
          type: string
        city:
          type: string
        country:
          type: string
      required:
        - street
        - number
        - zip
        - city
        - country
      example:
        id: 1
        street: Main Street
        number: 123
        zip: 12345
        city: Sample City
        country: Sample Country
    Invoice:
      type: object
      xml:
        name: Invoice
      properties:
        id:
          type: integer
        description:
          type: string
        viaMail:
          type: boolean
        preText:
          type: string
        postText:
          type: string
        serviceFrom:
          type: string
          format: date
        serviceTo:
          type: string
          format: date
        orderNumber:
          type: string
        customerNumber:
          type: integer
        paid:
          type: boolean
        positions:
          type: array
          items:
            type: integer
        receiver:
          type: integer
        salesTax:
          type: integer
        invoiceTemplate:
          type: integer
        file:
          type: integer
      required:
        - serviceFrom
        - customerNumber
        - salesTax
        - invoiceTemplate
      example:
        id: 1
        description: Invoice for consulting services
        viaMail: true
        preText: Thank you for your business.
        postText: Please pay within 30 days.
        serviceFrom: 2024-01-01
        serviceTo: 2024-01-31
        orderNumber: ORD-12345
        customerNumber: 1001
        paid: false
        positions:
          - 1
          - 2
        receiver: 1
        salesTax: 1
        invoiceTemplate: 1
        file: 1
    File:
      type: object
      xml:
        name: File
      properties:
        id:
          type: integer
        fileName:
          type: string
        data:
          type: string
          format: binary
      required:
        - fileName
        - data
      example:
        id: 1
        fileName: template.docx
        data: (binary data)
    DownloadFile:
      type: object
      xml:
        name: DownloadFile
      properties:
        id:
          type: integer
        fileName:
          type: string
        data:
          type: string
          format: byte
      required:
        - id
        - fileName
        - data
      example:
        id: 1
        fileName: template.docx
        data: (base64 encoded data)
    Error:
      type: object
      xml:
        name: Error
      properties:
        code:
          type: string
        description:
          type: string
      required:
        - code
        - description
      example:
        code: ERROR_INVOICE_NOT_FOUND
        description: Invoice with the given (ID) was not found
