openapi: 3.0.0
info:
  title: Invoice Manager API
  version: 2.0.0
  description: This is a simple API to manage invoices
servers:
  - url: http://localhost:8080/invoice-manager-server
    description: Local development server

paths:
  # Invoice
  /invoices:
    get:
      summary: Get all invoices
      description: Get a list of all invoices with optional filters for paid status, customer number, receiver id, and order number.
      tags:
        - Invoices
      operationId: getAllInvoices
      parameters:
        - name: paid
          in: query
          description: Filter invoices by paid status
          required: false
          schema:
            type: boolean
        - name: customerNumber
          in: query
          description: Filter invoices by customer number
          required: false
          schema:
            type: integer
        - name: receiverId
          in: query
          description: Filter invoices by receiver
          required: false
          schema:
            type: integer
        - name: orderNumber
          in: query
          description: Filter invoices by order number
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of invoices
          content:
            application/xml:
              schema:
                description: A list of invoices
                type: array
                xml:
                  name: Invoices
                  wrapped: true
                items:
                  $ref: '#/components/schemas/Invoice'
        '500':
          description: Error while getting the invoices
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new invoice
      description: Create a new invoice based on the provided invoice data.
      tags:
        - Invoices
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Invoice'
      responses:
        '201':
          description: The invoice was created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Invoice'
        '500':
          description: Error while creating the invoice
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
  /invoices/{id}:
    get:
      summary: Get an invoice by id
      description: Get the details of a specific invoice using its unique identifier.
      tags:
        - Invoices
      operationId: getInvoiceById
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the invoice
          schema:
            type: integer
      responses:
        '200':
          description: An invoice
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Invoice with given id not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error while getting the invoice
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an invoice
      description: Update the details of an existing invoice using its unique identifier.
      tags:
        - Invoices
      operationId: updateInvoiceById
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the invoice
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Invoice'
      responses:
        '200':
          description: The updated invoice
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Invoice with given id not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error while updating the invoice
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an invoice
      description: Delete an existing invoice using its unique identifier. Throws an error if the invoice has associated positions.
      tags:
        - Invoices
      operationId: deleteInvoiceById
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the invoice
          schema:
            type: integer
      responses:
        '200':
          description: The invoice was deleted
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Invoice with given id not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error while deleting the invoice
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
  /invoices/{id}/positions:
    get:
      summary: Get all positions of an invoice
      description: Get all positions associated with a specific invoice using its unique identifier.
      tags:
        - Invoices
      operationId: getAllPositionsOfInvoice
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the invoice
          schema:
