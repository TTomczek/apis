  /invoices/{id}/pdf:
    get:
      summary: Get an invoice as PDF
      description: Generate a pdf file for the invoice with the given id and returns its unique identifier.
      tags:
        - Invoices
      operationId: getInvoicePdfById
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the invoice
          schema:
            type: integer
      responses:
        '200':
          description: The pdf file id of the invoice
          content:
            application/xml:
              schema:
                description: The pdf file id of the invoice
                type: integer
        '404':
          description: Invoice with given id not found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'

