openapi: 3.0.0
info:
  title: Invoice Manager API
  version: 2.0.0
servers:
  - url: http://localhost:8080/invoice-manager-server
    description: Local development server

paths:
  # Invoice
  /invoices:
    get:
      tags:
        - Invoices
      parameters:
        - name: paid
          in: query
          required: false
          schema:
            type: boolean
        - name: customerNumber
          in: query
          required: false
          schema:
            type: integer
        - name: receiverId
          in: query
          required: false
          schema:
            type: integer
        - name: orderNumber
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
            application/xml:
              schema:
                type: array
                xml:
                  name: Invoices
                  wrapped: true
                items:
                  $ref: '#/components/schemas/Invoice'
        '500':
          description: Error while getting the invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invoice'
          application/xml:
            schema:
              $ref: '#/components/schemas/Invoice'
      responses:
        '201':
          description: The invoice was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
            application/xml:
              schema:
                $ref: '#/components/schemas/Invoice'
        '500':
          description: Error while creating the invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/xml:
              schema:
                $ref: '#/components/schemas/Error'
  /invoices/{id}:
