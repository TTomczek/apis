components:
  schemas:
    SalesTax:
      type: object
      xml:
        name: SalesTax
      properties:
        id:
          type: integer
        rate:
          type: number
        name:
          type: string
      required:
        - rate
        - name
    InvoicePosition:
      type: object
      xml:
        name: InvoicePosition
      properties:
        id:
          type: integer
        description:
          type: string
        pricePerUnitInCents:
          type: number
        quantity:
          type: number
          format: float
        unit:
          type: string
          enum:
            - hour
            - pd
            - piece
        invoice:
          type: integer
      required:
        - pricePerUnitInCents
        - quantity
        - unit
        - invoice
    InvoiceTemplate:
      type: object
      xml:
        name: InvoiceTemplate
      properties:
        id:
          type: integer
        name:
          type: string
        marginTopFirstPage:
          type: number
          format: float
        marginBottomFirstPage:
          type: number
          format: float
        marginTopOtherPages:
          type: number
          format: float
        marginBottomOtherPages:
          type: number
          format: float
        fileId:
          type: integer
      required:
        - name
        - marginTopFirstPage
        - marginBottomFirstPage
        - marginTopOtherPages
        - marginBottomOtherPages
    ContactPerson:
      type: object
      xml:
        name: ContactPerson
      properties:
        id:
          type: integer
        name:
          type: string
        firstName:
          type: string
        email:
          type: string
        salutation:
          type: string
          enum:
            - Frau
            - Herr
            - Divers
        address:
          $ref: '#/components/schemas/Address'
        businessPartner:
          type: integer
      required:
        - firstName
        - name
        - salutation
        - businessPartner
        - email
    BusinessPartner:
      type: object
      xml:
        name: BusinessPartner
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        contactPersons:
          type: array
          items:
            type: integer
        invoices:
          type: array
          items:
            type: integer
      required:
        - name
        - address
    Address:
      type: object
      xml:
        name: Address
      properties:
        id:
          type: integer
        street:
          type: string
        number:
          type: string
        zip:
          type: string
        city:
          type: string
        country:
          type: string
      required:
        - street
        - number
        - zip
        - city
        - country
    Invoice:
      type: object
      xml:
        name: Invoice
      properties:
        id:
          type: integer
        description:
          type: string
        viaMail:
          type: boolean
        preText:
          type: string
        postText:
          type: string
        serviceFrom:
          type: string
          format: date
        serviceTo:
          type: string
          format: date
        orderNumber:
          type: string
        customerNumber:
          type: integer
        paid:
          type: boolean
        positions:
          type: array
          items:
            type: integer
        receiver:
          type: integer
        salesTax:
          type: integer
        invoiceTemplate:
          type: integer
        file:
          type: integer
      required:
        - serviceFrom
        - customerNumber
        - salesTax
        - invoiceTemplate
    File:
      type: object
      xml:
        name: File
      properties:
        id:
          type: integer
        fileName:
          type: string
        data:
          type: string
          format: binary
      required:
        - fileName
        - data
    DownloadFile:
      type: object
      xml:
        name: DownloadFile
      properties:
        id:
          type: integer
        fileName:
          type: string
        data:
          type: string
          format: byte
      required:
        - id
        - fileName
        - data
    Error:
      type: object
      xml:
        name: Error
      properties:
        code:
          type: string
        description:
          type: string
      required:
        - code
        - description
